# Déploiement du site vitrine + doc publiée (VitePress) sur GitHub Pages.
# Le site est construit depuis site/, avec docs/ comme source des pages.
#
# Prérequis côté dépôt : Settings → Pages → Source = « GitHub Actions ».
name: Déploiement du site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated de VitePress lit les dates de commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run docs:build
        working-directory: site
        # SITE_BASE non défini => '/', le site est servi à la racine du domaine
        # personnalisé. Pour un déploiement sur stephanfo.github.io/airfield-brief/,
        # définir SITE_BASE: /airfield-brief/ ici.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
